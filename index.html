<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVault — Curated Deals &amp; Top Picks from Amazon</title>
  <meta name="description" content="Discover hand-picked deals and top-rated products from Amazon. Browse trending gadgets, home essentials, and more at the best prices." />
  <meta name="robots" content="index, follow" />

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#0f1117] text-gray-100 font-[Inter] antialiased min-h-screen">

  <!-- ═══════════════════════════  TOAST CONTAINER  ═══════════════════════════ -->
  <div id="toast-container" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- ═══════════════════════════  NAVIGATION BAR  ═══════════════════════════ -->
  <nav id="main-nav" class="sticky top-0 z-50 bg-[#131519]/80 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <!-- Logo -->
        <a href="#/" id="nav-logo" class="flex items-center gap-2 shrink-0 group cursor-pointer">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:shadow-amber-500/40 transition-shadow">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-gray-900"></i>
          </div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-amber-300 to-orange-400 bg-clip-text text-transparent">ShopVault</span>
        </a>

        <!-- Search Bar -->
        <div id="search-wrapper" class="flex-1 max-w-xl hidden sm:block">
          <div class="relative group">
            <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 group-focus-within:text-amber-400 transition-colors"></i>
            <input
              type="text"
              id="search-input"
              placeholder="Search products…"
              class="w-full h-10 pl-10 pr-4 rounded-xl bg-white/5 border border-white/10 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition-all"
            />
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-3 shrink-0">
          <!-- Category Filter -->
          <div class="relative hidden md:block">
            <select id="category-filter" class="appearance-none h-10 pl-3 pr-8 rounded-xl bg-white/5 border border-white/10 text-sm text-gray-300 focus:outline-none focus:border-amber-500/50 cursor-pointer hover:bg-white/10 transition-colors">
              <option value="all">All Categories</option>
            </select>
            <i data-lucide="chevron-down" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"></i>
          </div>

          <!-- Mobile Search Toggle -->
          <button id="mobile-search-btn" class="sm:hidden w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
          </button>

          <!-- Admin Lock Icon -->
          <a href="#/admin" id="admin-lock-btn" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center hover:bg-amber-500/10 hover:border-amber-500/30 transition-all group" title="Admin Portal">
            <i data-lucide="lock" class="w-4 h-4 text-gray-500 group-hover:text-amber-400 transition-colors"></i>
          </a>
        </div>
      </div>

      <!-- Mobile Search (hidden by default) -->
      <div id="mobile-search" class="hidden pb-3 sm:hidden">
        <div class="relative">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input
            type="text"
            id="mobile-search-input"
            placeholder="Search products…"
            class="w-full h-10 pl-10 pr-4 rounded-xl bg-white/5 border border-white/10 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition-all"
          />
        </div>
        <!-- Mobile Category Filter -->
        <select id="mobile-category-filter" class="mt-2 w-full appearance-none h-10 pl-3 pr-8 rounded-xl bg-white/5 border border-white/10 text-sm text-gray-300 focus:outline-none focus:border-amber-500/50 cursor-pointer">
          <option value="all">All Categories</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- ═══════════════════════════  MAIN CONTENT AREA  ═══════════════════════════ -->
  <main id="app-root" class="min-h-[calc(100vh-4rem)]">
    <!-- Views injected here by router -->
  </main>

  <!-- ═══════════════════════════  FOOTER  ═══════════════════════════ -->
  <footer id="main-footer" class="border-t border-white/5 bg-[#0c0e12]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center">
            <i data-lucide="shopping-bag" class="w-4 h-4 text-gray-900"></i>
          </div>
          <span class="text-sm font-semibold text-gray-400">ShopVault</span>
        </div>
        <p class="text-xs text-gray-600 text-center max-w-md leading-relaxed">
          As an Amazon Associate, we earn from qualifying purchases. Product prices and availability are accurate as of the date/time indicated and are subject to change.
        </p>
        <a href="#/admin" class="text-xs text-gray-600 hover:text-amber-400 transition-colors flex items-center gap-1">
          <i data-lucide="shield" class="w-3 h-3"></i>
          Admin
        </a>
      </div>
    </div>
  </footer>

  <!-- ═══════════════════════════  CONFIRM MODAL  ═══════════════════════════ -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-[9000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="confirm-backdrop"></div>
    <div class="relative bg-[#1a1d24] border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
      <h3 id="confirm-title" class="text-lg font-semibold text-gray-100 mb-2">Confirm Action</h3>
      <p id="confirm-message" class="text-sm text-gray-400 mb-6">Are you sure?</p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel-btn" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-gray-300 hover:bg-white/10 transition-colors">Cancel</button>
        <button id="confirm-ok-btn" class="px-4 py-2 rounded-xl bg-red-500/80 hover:bg-red-500 text-sm text-white font-medium transition-colors">Delete</button>
      </div>
    </div>
  </div>

  <!-- App Scripts -->
  <script src="firebase-config.js?v=5"></script>
  <script src="store.js?v=5"></script>
  <script src="components.js?v=5"></script>
  <script src="admin.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
